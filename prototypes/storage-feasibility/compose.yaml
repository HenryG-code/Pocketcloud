# Disposable feasibility test. Never point this at real files.
name: pocketcloud-proto
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -filer
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      # Defaults are 30 GiB volumes. Small volumes keep allocation visible and bounded.
      - -master.volumeSizeLimitMB=256
      - -volume.max=16
      - -volume.minFreeSpace=5GiB
    mem_limit: 2g
    # Only the S3 API is published, and only on this machine.
    ports:
      - "127.0.0.1:18333:8333"
    volumes:
      - data:/data
      - ./.local/s3.json:/etc/seaweedfs/s3.json:ro
volumes:
  data:
